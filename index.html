        .navbar-custom {

        }

            text-decoration: none;
            color: #e2b04a;
            font-weight: bold;
            font-size: 14px;
        }

        /* SECTIONS DU SITE */
        section { padding: 80px 20px; text-align: center; }
        .hero { padding: 100px 20px; }
        .hero-logo-main { max-width: 280px; margin-bottom: 20px; }
        .services-visual { background: white; color: #0d2340; }

        /* BLOC CARTE ZONE D'INTERVENTION */
        .map-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #e2b04a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
