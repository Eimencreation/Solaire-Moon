<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaire Moon - Nettoyage Professionnel en Suisse</title>
    <meta name="description" content="Solaire Moon - Spécialistes du nettoyage professionnel dans les cantons de Vaud et Valais.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* CONFIGURATION DE LA BARRE DE NAVIGATION */
        .navbar-custom {
            display: flex !important;
            justify-content: space-between;
            align-items: center;
            background-color: #0d2340; /* Bleu nuit */
            padding: 10px 40px;
            font-family: 'Montserrat', sans-serif;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo-block img {
            height: 60px; /* Taille pour ton nouveau logo */
            width: auto;
            display: block;
        }

        .nav-links-container {
            display: flex;
            gap: 25px;
        }

        .nav-tab-item {
            display: flex;
            flex-direction: column; /* Icône au-dessus du texte */
            align-items: center;    /* Symétrie parfaite */
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .nav-tab-item span:first-child { font-size: 18px; }
        .nav-tab-item span:last-child {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* BOUTON TÉLÉPHONE (Ligne unique forcée) */
        .phone-nav-button {
            display: flex !important;
            flex-direction: row !important; /* Force icône + texte côte à côte */
            align-items: center !important;
            white-space: nowrap !important; /* Interdit le retour à la ligne */
            border: 2px solid #e2b04a; /* Bordure dorée */
            border-radius: 50px;
            padding: 8px 20px;
            text-decoration: none;
            min-width: max-content;
        }

        .phone-text-gold {
            color: #e2b04a;
            font-weight: bold;
            font-size: 15px;
            margin-left: 10px;
        }

        /* HERO SECTION */
        .hero {
            padding: 100px 20px;
            text-align: center;
            color: white;
        }
        .hero-logo-img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar-custom">
            <div class="nav-logo-block">
                <a href="#accueil">
                    <img src="LOGO.jpeg" alt="Solaire Moon Logo">
                </a>
            </div>

            <div class="nav-links-container">
                <a href="#accueil" class="nav-tab-item"><span>🏠</span><span>Accueil</span></a>
                <a href="#services" class="nav-tab-item"><span>✨</span><span>Services</span></a>
                <a href="#avantages" class="nav-tab-item"><span>⚡</span><span>Avantages</span></a>
                <a href="#zone" class="nav-tab-item"><span>📍</span><span>Zone</span></a>
                <a href="#contact" class="nav-tab-item"><span>📞</span><span>Contact</span></a>
            </div>

            <a href="tel:+41768191040" class="phone-nav-button">
                <span style="color: #ff3366;">📞</span>
                <span class="phone-text-gold">+41 76 819 10 40</span>
            </a>
        </nav>
    </header>

    <section id="accueil" class="hero">
        <div class="hero-content">
            <img src="LOGO.jpeg" alt="Solaire Moon" class="hero-logo-img">
            <p style="font-size: 1.5rem; font-weight: bold; margin-top: 10px;">NETTOYAGE</p>
            <p style="max-width: 600px; margin: 20px auto; font-family: 'Montserrat', sans-serif;">
                Nous réalisons tous types de prestations de nettoyage professionnel en Suisse.
            </p>
            <a href="#contact" style="background-color: #e2b04a; color: #0d2340; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">📞 Demandez un devis gratuit</a>
        </div>
    </section>

    </body>
</html>
