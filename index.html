<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaire Moon - Nettoyage Professionnel en Suisse</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* 1. CORRECTION BARRE DE NAVIGATION (LIGNE UNIQUE) */
        .navbar-custom {
            display: flex !important;
            justify-content: space-between;
            align-items: center;
            background-color: #0d2340; /* Votre bleu d'origine */
            padding: 10px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-links-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
        }

        .nav-tab-item span:last-child {
            font-size: 10px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* BOUTON TÉLÉPHONE SUR UNE LIGNE */
        .phone-nav-button {
            display: flex !important;
            align-items: center !important;
            white-space: nowrap !important;
            border: 2px solid #e2b04a; /* Votre doré */
            border-radius: 50px;
            padding: 8px 20px;
            text-decoration: none;
            color: #e2b04a;
            font-weight: bold;
            font-size: 14px;
        }

        /* 2. STYLE DE LA CARTE */
        .map-section {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }
        .map-wrapper {
            max-width: 1000px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar-custom">
            <div class="nav-logo-block">
                <a href="#accueil"><img src="LOGO.jpeg" alt="Logo" style="height: 50px; width: auto;"></a>
            </div>

            <div class="nav-links-container">
                <a href="#accueil" class="nav-tab-item"><span>🏠</span><span>ACCUEIL</span></a>
                <a href="#services" class="nav-tab-item"><span>✨</span><span>SERVICES</span></a>
                <a href="#avantages" class="nav-tab-item"><span>⚡</span><span>AVANTAGES</span></a>
                <a href="#zone" class="nav-tab-item"><span>📍</span><span>ZONE</span></a>
                <a href="#contact" class="nav-tab-item"><span>📞</span><span>CONTACT</span></a>
            </div>

            <a href="tel:+41768191040" class="phone-nav-button">
                <span style="margin-right: 8px;">📞</span> +41 76 819 10 40
            </a>
        </nav>
    </header>

    <section id="zone" class="map-section">
        <h2 style="color: #0d2340;">📍 Notre Zone d'Intervention</h2>
        <p style="color: #666;">Nous intervenons rapidement dans les cantons de <strong>Vaud</strong> et <strong>Valais</strong>.</p>
        
        <div class="map-wrapper">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d175440.385034606!2d6.505058641972803!3d46.52844898166687!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x478c29aecd026f73%3A0x7f4e93342502787c!2sCanton%20de%20Vaud%2C%20Suisse!5e0!3m2!1sfr!2sfr!4v1700000000000!5m2!1sfr!2sfr" 
                width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </section>

    </body>
</html>
